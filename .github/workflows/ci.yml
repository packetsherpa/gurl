name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # If this GitHub Enterprise instance uses self-hosted runners, change this
    # label (e.g. to [self-hosted, linux]) to match an available runner.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 guards the project's minimum (requires-python >= 3.10); 3.12 is a
        # current interpreter.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Format check (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Tests (pytest)
        run: uv run --python ${{ matrix.python-version }} pytest -q
